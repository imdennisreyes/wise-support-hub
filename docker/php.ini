; ── Wise Support Hub — PHP production settings ───────────────────────────────

; Error handling — log only, never display in browser
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Limits
max_execution_time = 120
max_input_time = 60
memory_limit = 128M
post_max_size = 16M
upload_max_filesize = 16M

; Timezone
date.timezone = UTC

; Session hardening (bootstrap.php sets these too, belt-and-suspenders)
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.gc_maxlifetime = 7200

; OPcache — significant performance boost for a read-heavy app
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 64
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 4000
opcache.revalidate_freq = 60
opcache.fast_shutdown = 1

; cURL — allow enough time for Confluence sync (fetches many pages)
; Individual request timeout is controlled in ConfluenceSyncService.php
default_socket_timeout = 60
